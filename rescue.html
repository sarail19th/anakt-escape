<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Rescue Run</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; background: #1b1c22; overflow: hidden;
    touch-action: none; -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  }
  #app { height: 100%; display: flex; flex-direction: column; align-items: center; }
  @supports (height: 100dvh) { #app { height: 100dvh; } }
  /* the board takes whatever room the controls leave; script sizes #wrap to fit it */
  #boardWrap { flex: 1; min-height: 0; width: 100%; display: flex; align-items: center; justify-content: center; }
  #wrap { position: relative; aspect-ratio: 448 / 576; width: 100%; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #btns { position: absolute; top: 1.2%; right: 2%; display: flex; gap: 6px; }
  #btns button {
    width: clamp(26px, 6vmin, 38px); height: clamp(26px, 6vmin, 38px);
    border: 0; border-radius: 8px; background: rgba(0,0,0,.55); color: #fff;
    font-size: clamp(13px, 3vmin, 19px); line-height: 1; cursor: pointer; padding: 0;
  }
  #btns button:hover { background: rgba(0,0,0,.75); }

  /* on-screen controls: only on touch devices (body.touch) */
  #ctrl { display: none; }
  body.touch #ctrl {
    display: flex; width: 100%; max-width: 560px; align-items: center; justify-content: space-around;
    padding: 6px 10px calc(10px + env(safe-area-inset-bottom));
  }
  body.touch { --b: clamp(44px, min(10.5dvh, 19vw), 68px); }
  #dpad { display: grid; grid-template-columns: repeat(3, var(--b)); grid-template-rows: repeat(3, var(--b)); gap: 3px; }
  .d {
    background: linear-gradient(#5d6070, #42454f); border: 3px solid #0d0e12; border-bottom: 7px solid #2a2c34;
    border-radius: 14px; display: flex; align-items: center; justify-content: center; padding: 0;
    touch-action: none; cursor: pointer;
  }
  .d:active { transform: translateY(3px); filter: brightness(1.25); }
  .d svg { width: 42%; height: 42%; fill: #e9ecf5; pointer-events: none; }
  #up { grid-area: 1 / 2; } #left { grid-area: 2 / 1; } #right { grid-area: 2 / 3; } #down { grid-area: 3 / 2; }
  #side { display: flex; align-items: center; justify-content: center; }
  body.touch #side #btns { position: static; flex-direction: column; gap: 9px; }
  body.touch #side #btns button {
    width: calc(var(--b) * 0.78); height: calc(var(--b) * 0.78); font-size: calc(var(--b) * 0.36);
    background: linear-gradient(#5d6070, #42454f); border: 3px solid #0d0e12; border-bottom: 6px solid #2a2c34; border-radius: 14px;
  }
  /* phone held sideways: D-pad on the left, buttons on the right, board in the middle */
  @media (orientation: landscape) and (max-height: 560px) {
    body.touch #app { flex-direction: row; align-items: stretch; }
    body.touch #boardWrap { width: auto; min-width: 0; }
    body.touch #ctrl { display: contents; }
    body.touch { --b: clamp(40px, 21dvh, 64px); }
    body.touch #dpad { order: -1; margin: 0 14px; align-self: center; }
    body.touch #side { order: 1; margin: 0 14px; align-self: center; }
    body.touch .srcfoot { position: fixed; left: 8px; bottom: 2px; padding: 0; }
  }
  /* small source link under the game; it must never take real room from the board */
  .srcfoot { flex: none; margin: 0; padding: 2px 10px calc(4px + env(safe-area-inset-bottom)); font: 11px/1.4 sans-serif; text-align: center; }
  .srcfoot a { color: #9aa3b5; text-decoration: underline; }
</style>
</head>
<body>
<div id="app">
  <div id="boardWrap">
    <div id="wrap">
      <canvas id="c"></canvas>
      <div id="btns">
        <button id="bMode" title="Calm / Normal pace (C)" aria-label="Toggle calm mode">&#128034;</button>
        <button id="bPause" title="Pause (P)" aria-label="Pause">&#9208;</button>
        <button id="bSnd" title="Sound (M)" aria-label="Toggle sound">&#128266;</button>
      </div>
    </div>
  </div>
  <div id="ctrl">
    <div id="dpad">
      <button class="d" id="up" data-dir="up" aria-label="Up"><svg viewBox="0 0 24 24"><path d="M12 5l9 14H3z"/></svg></button>
      <button class="d" id="left" data-dir="left" aria-label="Left"><svg viewBox="0 0 24 24"><path d="M5 12l14-9v18z"/></svg></button>
      <button class="d" id="right" data-dir="right" aria-label="Right"><svg viewBox="0 0 24 24"><path d="M19 12L5 3v18z"/></svg></button>
      <button class="d" id="down" data-dir="down" aria-label="Down"><svg viewBox="0 0 24 24"><path d="M12 19L3 5h18z"/></svg></button>
    </div>
    <div id="side"></div>
  </div>
  <p class="srcfoot"><a href="https://github.com/sarail19th/anakt-escape" target="_blank" rel="noopener noreferrer">Source on GitHub</a></p>
</div>

const PX = 2;
function tinted(c, color) {
  const o = document.createElement('canvas');
  o.width = c.width; o.height = c.height;
  const g = o.getContext('2d');
  g.drawImage(c, 0, 0);
  g.globalCompositeOperation = 'source-in';
  g.fillStyle = color; g.fillRect(0, 0, o.width, o.height);
  return o;
}
function makeSprite(rows, pal, flip) {
  const h = rows.length, w = rows[0].length;
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d');
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const ch = rows[y][flip ? w - 1 - x : x];
    if (ch !== '.' && pal[ch]) { g.fillStyle = pal[ch]; g.fillRect(x, y, 1, 1); }
  }
  c.sh = tinted(c, '#101116');
  return c;
}
// build {down, up, right, left} -> [frame0, frame1] from art that only draws down / up / right

  const o = {};

  o.left = art.right.map(f => makeSprite(f, pal, true));
  return o;
}

let actx = null;
function audioInit() {
  if (!actx) {
    try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; }
  }
  if (actx && actx.state === 'suspended') actx.resume();
}
function tone(f, d, type = 'square', vol = 0.05, f2 = null, delay = 0) {
  if (muted || !actx) return;
  const t = actx.currentTime + delay;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g); g.connect(actx.destination);
  o.start(t); o.stop(t + d + 0.02);
}

// ---------------------------------------------------------------- stage setup
function levelParams(n) {
  const u = 9.5, k = (n - 1) / 5; // tiles/second at "100%" speed; difficulty grows with the stage
  const p = P();
  return { pac: (0.8 + 0.1 * k) * u * p.hero, ghost: (0.72 + 0.17 * k) * u * p.dog, tun: (0.4 + 0.1 * k) * u * p.dog };
}
function schedule(n) {
  if (n <= 2) return [7, 20, 7, 20, 5, 20, 5, Infinity];
  if (n <= 4) return [7, 20, 7, 20, 5, 1033, 1 / 60, Infinity];
  return [5, 20, 5, 20, 5, 1037, 1 / 60, Infinity];
}

function place(e) {
  e.x = e.tx + 0.5 + e.dx * e.p;
  e.y = e.ty + 0.5 + e.dy * e.p;
}

const lagMul = () => [1, 1.5, 2.2, 3, 5][memN];
const followMul = () => [1, 0.85, 0.7, 0.5, 0.2][memN];
const lagNow = f => LAG[f.id] * lagMul();

function seedTrail() {
  trail = [{ x: pac.x, y: pac.y, d: pacDist - 80, jump: false }, { x: pac.x, y: pac.y, d: pacDist, jump: false }];
}
function addFollower(id, x, y, blend) {
  if (!trail.length) seedTrail();
  const f = { id, x, y, sx: x, sy: y, blend, capD: 0, dir: 'down', moving: false };
  f.capD = pacDist - lagNow(f);
  team.push(f);
}

  // robots on random tiles away from the hero
  robots = [];

// ---------------------------------------------------------------- movement
// An entity sits on tile (tx,ty) heading in (dx,dy) with progress p in [0,1) toward the next tile.
function advance(e, dist, choose) {
  for (let guard = 0; dist > 0 && guard < 8; guard++) {
    if (e.dx === 0 && e.dy === 0) { choose(e); if (e.dx === 0 && e.dy === 0) return; }
    const room = 1 - e.p;
    if (dist < room) { e.p += dist; return; }
    dist -= room;
    e.tx = wrapX(e.tx + e.dx); e.ty += e.dy; e.p = 0;
    choose(e);
  }
}
function reverseEnt(e) {
  if (!e.dx && !e.dy) return;
  e.tx = wrapX(e.tx + e.dx); e.ty += e.dy;
  e.dx = -e.dx; e.dy = -e.dy;
  e.p = 1 - e.p;
  place(e);
}

function pacChoose(e) {
  if (want && open(e.tx + want.dx, e.ty + want.dy)) {
    e.dx = want.dx; e.dy = want.dy; e.fx = e.dx; e.fy = e.dy;
    return;
  }
  if (e.dx || e.dy) {
    if (!open(e.tx + e.dx, e.ty + e.dy)) { e.dx = 0; e.dy = 0; }
    else { e.fx = e.dx; e.fy = e.dy; }
  }
}

function ghostTarget(g) {
  if (g.cool > 0) return g.scatter;               // just tackled: back off for a moment
  if (alarmT > 0) return [pac.tx, pac.ty];        // the alarm is ringing: everybody comes this way
  if (ghostMode === 'scatter') return g.scatter;
  const px = pac.tx, py = pac.ty, fx = pac.fx, fy = pac.fy;
  switch (g.name) {
    case 'pinky': return [px + 4 * fx - (fy === -1 ? 4 : 0), py + 4 * fy];
    case 'inky': {
      const ax = px + 2 * fx - (fy === -1 ? 2 : 0), ay = py + 2 * fy, b = ghosts[0];
      return [b.tx + 2 * (ax - b.tx), b.ty + 2 * (ay - b.ty)];
    }
    case 'clyde': {
      const dx = g.tx - px, dy = g.ty - py;
      return dx * dx + dy * dy > 64 ? [px, py] : g.scatter;
    }
    default: return [px, py];
  }
}

function ghostChoose(g) {
  const cand = [];
  for (const d of ORDER) {
    if ((g.dx || g.dy) && g.dx === -d.dx && g.dy === -d.dy) continue;
    if (!open(g.tx + d.dx, g.ty + d.dy)) continue;
    if (d === DIRS.up && NO_UP.has(g.tx + ',' + g.ty)) continue;
    cand.push(d);
  }
  if (!cand.length) cand.push({ dx: -g.dx, dy: -g.dy });
  const [tx, ty] = ghostTarget(g);
  let best = cand[0], bd = 1e9;
  for (const d of cand) {
    const nx = g.tx + d.dx, ny = g.ty + d.dy;
    const v = (nx - tx) * (nx - tx) + (ny - ty) * (ny - ty);
    if (v < bd) { bd = v; best = d; }
  }
  g.dx = best.dx; g.dy = best.dy;
}

// an alien guard is hunting while the alarm rings (unless it was just tackled and is backing off)
const hunting = g => alarmT > 0 && g.cool <= 0;

// guards wander close to their post and head back if they drift too far
const ALIEN_LEASH = 3.5;
function patrolChoose(g) {
  const far = Math.hypot(g.tx - g.post[0], g.ty - g.post[1]) > ALIEN_LEASH;
  let cand = ORDER.filter(d => open(g.tx + d.dx, g.ty + d.dy) && (far || !(g.dx === -d.dx && g.dy === -d.dy)));
  if (!cand.length) cand = [{ dx: -g.dx, dy: -g.dy }];
  let d = pick(cand);
  if (far) {
    const dd = o => Math.hypot(g.tx + o.dx - g.post[0], g.ty + o.dy - g.post[1]);
    d = cand.reduce((a, b) => dd(b) < dd(a) ? b : a);
  }
  g.dx = d.dx; g.dy = d.dy;
}

function ghostSpeed(g) {
  if (g.kind === 'alien' && !hunting(g)) return ALIEN_SPEED * P().alien;
  if (g.ty === 14 && (g.tx < 6 || g.tx > 21)) return lv.tun;
  return lv.ghost * (alarmT > 0 ? P().alarmBoost : 1);
}

function moveGhost(g, dt) {
  const sp = 3.5 * dt;
  switch (g.mode) {
    case 'house':
      g.y = 14.5 + Math.sin(time * 7 + g.i * 2) * 0.2;
      break;
    case 'leaving':
      if (g.y > 11.5 && Math.abs(g.x - 14) > 0.001) {
        g.y = approach(g.y, 14.5, sp); g.x = approach(g.x, 14, sp);
      } else if (g.y > 11.5) {
        g.y = approach(g.y, 11.5, sp);
      } else {
        Object.assign(g, { mode: 'normal', tx: 14, ty: 11, dx: -1, dy: 0, p: 0.5 });
        place(g);
      }
      break;
    default:
      advance(g, ghostSpeed(g) * dt, g.kind === 'alien' && !hunting(g) && g.cool <= 0 ? patrolChoose : ghostChoose);
      place(g);
  }
}

// a dog leaves the kennel, or gets up from where it was waiting in the maze
function releaseDog(g) {
  if (g.mode === 'house') { g.mode = 'leaving'; return; }
  const d = ORDER.find(o => open(g.tx + o.dx, g.ty + o.dy));
  g.dx = d.dx; g.dy = d.dy; g.p = 0; g.mode = 'normal'; place(g);
}

// robots amble around at random
function robotChoose(e) {
  const cand = ORDER.filter(d => open(e.tx + d.dx, e.ty + d.dy) && !(e.dx === -d.dx && e.dy === -d.dy));
  const d = cand.length ? pick(cand) : { dx: -e.dx, dy: -e.dy };
  e.dx = d.dx; e.dy = d.dy;
}

// aliens walk the ring around the stairs
function moveAlien(a, dt) {
  a.s = (a.s + ALIEN_SPEED * P().alien * dt) % RING.length;
  const i = Math.floor(a.s), f = a.s - i, p = RING[i], q = RING[(i + 1) % RING.length];
  a.x = lerp(p[0], q[0], f) + 0.5; a.y = lerp(p[1], q[1], f) + 0.5;
  a.dir = q[0] > p[0] ? 'right' : q[0] < p[0] ? 'left' : q[1] > p[1] ? 'down' : 'up';
}

// ---------------------------------------------------------------- game rules
const near = (a, b, r) => {
  let dx = Math.abs(a.x - b.x); dx = Math.min(dx, COLS - dx);
  const dy = a.y - b.y;
  return dx * dx + dy * dy < r * r;
};
const dist2 = (a, b) => { let dx = Math.abs(a.x - b.x); dx = Math.min(dx, COLS - dx); return Math.hypot(dx, a.y - b.y); };

function collectFlower(pts, x, y) {
  addScore(pts);
  const gained = hearts < MAX_HEARTS;
  hearts = Math.min(MAX_HEARTS, hearts + 1);
  boostT = BOOST_SECS;
  popup(x, y, gained ? '+1 ♥' : String(pts), '#ff3b5c', 1.2);
  sfx.flower();
}

function loseLife() {
  state = 'dying'; dieT = 0; deathSfx = false;
}

// a dog, robot or alien tackles the hero: lose a heart, the attacker backs off
function hurt(src) {
  if (hurtT > 0) return;
  hearts--; hurtT = P().hurt; shakeT = P().shake ? 0.3 : 0;
  popup(pac.x, pac.y - 0.6, '-1 ♥', '#ff2a2a', 1);
  sfx.hurt();
  if (src) { src.cool = 2.5; reverseEnt(src); }
  if (hearts <= 0) loseLife();
}

function eatPellet() {
  const onNext = pac.p >= 0.5;
  const x = onNext ? wrapX(pac.tx + pac.dx) : pac.tx, y = onNext ? pac.ty + pac.dy : pac.ty;
  if ((onNext ? 1 - pac.p : pac.p) > 0.3) return;
  const idx = y * COLS + x, v = pellets[idx];
  if (!v) return;
  pellets[idx] = 0;
  dotsEaten++;
  if (v === 1) { addScore(10); dotCharge = Math.min(1, dotCharge + 0.2); sfx.waka(); }
  else collectFlower(FLOWER_PTS[stageNo - 1], x + 0.5, y + 0.5);
  if (dotsEaten === 70 || dotsEaten === 170) bonus = { t: 9.5 };
}

// stage 2: the key shows up somewhere out in the maze after a random delay
function spawnKey() {
  const cands = [];
  for (let y = 1; y < ROWS - 1; y++) for (let x = 1; x < COLS - 1; x++) {
    if (!open(x, y) || y === 14) continue;
    if (x >= 9 && x <= 18 && y >= 11 && y <= 17) continue;            // kennel
    if (Math.abs(x - pac.tx) + Math.abs(y - pac.ty) < 12) continue;   // not right under the hero's nose
    cands.push([x, y]);
  }
  const [x, y] = pick(cands);
  keyS = { mode: 'out', t: 0, x: x + 0.5, y: y + 0.5 };
  popup(keyS.x, keyS.y - 1, 'KEY!', '#f2c230', 1.6);
  sfx.key();
}

function wakeSleepers() {
  roomOpen = true; cageOpenT = 0;
  sleepers.forEach(s => { s.mode = 'waking'; s.t = 1.1; });
  if (st.cage) hasKey = false;
  addScore(500);
  sfx.wake();
}

function trailAt(d) {
  let i = 0;
  while (i < trail.length - 2 && trail[i + 1].d < d) i++;
  const a = trail[i], b = trail[i + 1];
  if (!b || d <= a.d) return a;
  if (b.jump) return d >= b.d ? b : a;
  const u = clamp01((d - a.d) / ((b.d - a.d) || 1));
  return { x: lerp(a.x, b.x, u), y: lerp(a.y, b.y, u) };
}

function updateTeam(dt) {
  for (const s of sleepers) {
    if (s.mode !== 'waking') continue;
    s.t -= dt;
    if (s.t <= 0) { s.done = true; addFollower(s.id, s.x, s.y, 1); }
  }
  sleepers = sleepers.filter(s => !s.done);
  const sp = Math.max(9, heroSpd * 1.15) * followMul();
  for (const f of team) {
    f.blend = Math.max(0, f.blend - dt / 0.6);
    const target = pacDist - lagNow(f), bx = f.x, by = f.y;
    if (f.capD < target) f.capD = Math.min(target, f.capD + sp * dt);
    const p = trailAt(f.capD);
    f.x = lerp(p.x, f.sx, f.blend); f.y = lerp(p.y, f.sy, f.blend);
    const mx = f.x - bx, my = f.y - by;
    f.moving = Math.hypot(mx, my) > 0.002 && Math.abs(mx) < COLS / 2;
    if (f.moving) f.dir = Math.abs(mx) > Math.abs(my) ? (mx > 0 ? 'right' : 'left') : (my > 0 ? 'down' : 'up');
  }
  if (team.length) {
    const minD = Math.min(...team.map(f => f.capD));
    while (trail.length > 2 && trail[1].d < minD) trail.shift();
  }
}

// every required friend is with the hero and close enough
function crewReady() {
  return st.crew.every(id => {
    const f = team.find(m => m.id === id);
    return f && f.blend <= 0 && dist2(f, pac) < lagNow(f) + 1.8;
  });
}
function goalReady() {
  if (st.need === 'none') return true;
  if (st.need === 'key') return hasKey;
  return crewReady();
}
function notReadyText() {
  if (st.need === 'key') return 'NEED THE KEY!';
  if (st.cage && sleepers.length) return 'FREE HIM FIRST!';
  if (st.beds && sleepers.length) return 'WAKE THE GIRLS!';
  return 'WAIT FOR THEM!';
}

function finishStage(kind, tx, ty) {
  state = 'clear'; clearT = 0;
  esc = { hx: pac.x, hy: pac.y, tx, ty, kind, f: team.map(f => ({ id: f.id, x: f.x, y: f.y })) };
  addScore(1000);
  if (kind === 'exit') sfx.clear(); else sfx.stairs();
}

function advanceStage() {
  if (stageNo === 5) {
    if (memN === 0) beginEnding('success');
    else startStage(6);
  } else if (stageNo === 6) beginEnding('true');
  else startStage(stageNo + 1);
}

function beginEnding(kind) {
  state = 'ending'; ending = { kind, t: 0 };
  meteors = []; flashes = [];
  if (kind === 'bad') sfx.sad(); else sfx.clear();
}

function step(dt) {
  stageT += dt;
  modeT += dt;
  if (modeT >= sched[modeIdx]) {
    modeT = 0; modeIdx++;
    ghostMode = modeIdx % 2 ? 'chase' : 'scatter';
    ghosts.forEach(g => { if (g.mode === 'normal') reverseEnt(g); });
  }
  if (boostT > 0) boostT = Math.max(0, boostT - dt);
  if (hurtT > 0) hurtT = Math.max(0, hurtT - dt);
  if (alarmT > 0) alarmT = Math.max(0, alarmT - dt);
  if (noticeT > 0) noticeT -= dt;
  if (roomOpen) cageOpenT += dt;
  dotCharge = Math.max(0, dotCharge - 0.45 * dt);

  // dogs leave the kennel on a timer
  const gap = (stageNo >= 4 ? 2.5 : 3.5) * P().release;
  ghosts.forEach((g, i) => { if ((g.mode === 'house' || g.mode === 'wait') && stageT >= gap * i) releaseDog(g); });

  if (keyS.mode === 'wait') { keyS.t -= dt; if (keyS.t <= 0) spawnKey(); }

  // hero
  if (want && (pac.dx || pac.dy) && want.dx === -pac.dx && want.dy === -pac.dy) reverseEnt(pac);
  heroSpd = lv.pac * (boostT > 0 ? BOOST_MUL : 1) * (1 + DOT_BOOST * dotCharge);
  advance(pac, heroSpd * dt, pacChoose);
  place(pac);
  pac.moving = !!(pac.dx || pac.dy);
  if (pac.moving) pac.phase += dt * (heroSpd > lv.pac * 1.1 ? 20 : 16);
  { // distance walked, so freed friends can retrace the hero's path
    const dx = pac.x - lastP.x;
    const jump = Math.abs(dx) > COLS / 2;
    pacDist += jump ? 0 : Math.hypot(dx, pac.y - lastP.y);
    lastP = { x: pac.x, y: pac.y };
    if (team.length) {
      const last = trail[trail.length - 1];
      if (jump || pacDist - last.d >= 0.12) trail.push({ x: pac.x, y: pac.y, d: pacDist, jump });
    }
  }
  eatPellet();

  // key, memory items, the sleeping room
  if (keyS.mode === 'out' && Math.hypot(pac.x - keyS.x, pac.y - keyS.y) < 0.7) {
    keyS.mode = 'carried'; hasKey = true;
    addScore(200); popup(pac.x, pac.y - 0.8, 'GOT THE KEY', '#f2c230', 1.4); sfx.key();
  }
  for (const it of items) {
    if (!it.hit && Math.hypot(pac.x - it.x, pac.y - it.y) < 0.65) {
      it.hit = true; memN++; sfx.item();
      popup(it.x, it.y - 0.9, it.name, '#ffe27a', 3);                           // the item's name
      popup(it.x, it.y - 0.2, memN >= 4 ? 'HE CAN\'T KEEP UP...' : 'HE STOPS TO LOOK...', '#d9b8ff', 3);
      if (memN >= 4) doomT = P().doom;
    }
  }
  items = items.filter(it => !it.hit);
  if (roomLit) lightT += dt;
  if (st.cage && !roomLit && pac.tx >= 11 && pac.tx <= 16 && pac.ty >= 13 && pac.ty <= 15) {
    // walking into the dark room with the key turns the light on
    if (hasKey) {
      roomLit = true; lightT = 0; hasKey = false; keyS.mode = 'used';
      popup(14, 12.3, 'LIGHTS ON!', '#ffe27a', 1.8); sfx.wake();
    } else if (noticeT <= 0) { noticeT = 2; popup(pac.x, pac.y - 0.8, 'TOO DARK... NEED THE KEY', '#ff5a5a', 1.6); }
  }
  if (st.cage && roomLit && sleepers.some(s => s.mode === 'asleep') && Math.hypot(pac.x - 14, pac.y - 14.5) < 1.1) wakeSleepers();   // cut the straps
  // the girls' bed fills the top-centre block: touching it from any side or corner wakes them (tiles around the block)
  if (st.beds && sleepers.some(s => s.mode === 'asleep') && pac.tx >= 12 && pac.tx <= 15 && pac.ty <= 5) {
    roomLit = true; lightT = 0;                    // the girls' room lights up as you arrive
    popup(14, 6.1, 'LIGHTS ON!', '#ffe27a', 1.8);
    wakeSleepers();
  }
  updateTeam(dt);

  // stairs and exit
  for (const s of st.stairs) {
    if (!s.goal || pacDist < 0.8 || Math.hypot(pac.x - (s.x + 0.5), pac.y - (s.y + 0.5)) > 0.55) continue;
    if (goalReady()) { finishStage(s.dir, s.x + 0.5, s.y + 0.5); return; }
    if (noticeT <= 0) { noticeT = 2; popup(pac.x, pac.y - 0.8, notReadyText(), '#ff5a5a', 1.4); }
  }
  if (st.exit && pac.ty === 29 && pac.tx >= 12 && pac.tx <= 15) {
    if (goalReady()) { finishStage('exit', 14, EXIT_Y + 0.4); return; }
    if (noticeT <= 0) { noticeT = 2; popup(pac.x, pac.y - 0.8, notReadyText(), '#ff5a5a', 1.4); }
  }

  // dogs, robots, aliens
  for (const g of ghosts) {
    if (g.cool > 0) g.cool -= dt;
    moveGhost(g, dt);
  }
  for (const r of robots) {
    if (r.cool > 0) r.cool -= dt;
    advance(r, ROBOT_SPEED * P().robot * dt, robotChoose);
    place(r);
    r.alert = dist2(r, pac) < ROBOT_R;
    if (r.alert) {
      if (alarmT <= 0) { sfx.alarm(); popup(r.x, r.y - 1, 'ALARM!', '#ff2a2a', 1.2); }
      alarmT = P().alarm;
      ghosts.forEach(g => { if (g.mode === 'house' || g.mode === 'wait') releaseDog(g); });
    }
  }
  aliens.forEach(a => moveAlien(a, dt));

  // tackles
  for (const g of ghosts) {
    if ((g.mode === 'normal' || g.mode === 'leaving') && near(pac, g, 0.6)) { hurt(g); if (state !== 'play') return; }
  }
  for (const r of robots) if (near(pac, r, 0.7)) { hurt(r); if (state !== 'play') return; }
  for (const a of aliens) if (near(pac, a, 0.65)) { hurt(a); if (state !== 'play') return; }

  if (bonus) {
    bonus.t -= dt;
    if (bonus.t <= 0) bonus = null;
    else if (Math.abs(pac.x - 14) < 0.8 && Math.abs(pac.y - 17.5) < 0.5) {
      collectFlower(FLOWER_PTS[stageNo - 1], 14, 17.5);
      bonus = null;
    }
  }

  // bad end: he can't keep up any more
  if (doomT > 0) { doomT -= dt; if (doomT <= 0) { beginEnding('bad'); return; } }
}

function tick(dt) {
  time += dt;
  if (shakeT > 0) shakeT = Math.max(0, shakeT - dt);
  if (fadeIn > 0) fadeIn = Math.max(0, fadeIn - dt);
  popups.forEach(p => { p.t += dt; });
  popups = popups.filter(p => p.t < p.life);
  switch (state) {
    case 'title':
      ghosts.forEach(g => { if (g.mode === 'house') moveGhost(g, dt); });
      break;
    case 'ready':
      ghosts.forEach(g => { if (g.mode === 'house') moveGhost(g, dt); });
      aliens.forEach(a => moveAlien(a, dt));
      stateT -= dt;
      if (stateT <= 0) state = 'play';
      break;
    case 'play':
      for (let r = dt; r > 0 && state === 'play'; r -= 1 / 60) step(Math.min(r, 1 / 60));
      break;
    case 'dying':
      dieT += dt;
      if (dieT > 0.7 && !deathSfx) { deathSfx = true; sfx.die(); }
      if (dieT > 2.3) { state = 'over'; overT = 0; }
      break;
    case 'clear':
      clearT += dt;
      if (clearT > 1.9) advanceStage();
      break;
    case 'over':
      overT += dt;
      break;
    case 'ending':
      ending.t += dt;
      if (ending.kind !== 'bad') {
        if (Math.random() < dt * 7) meteors.push({ x: Math.random() * (W + 160), y: -20, vx: -(90 + Math.random() * 90), vy: 220 + Math.random() * 160, len: 0.1 + Math.random() * 0.08 });
        meteors.forEach(m => { m.x += m.vx * dt; m.y += m.vy * dt; });
        meteors = meteors.filter(m => {
          if (m.y < 330) return true;
          flashes.push({ x: m.x, t: 0 });
          return false;
        });
        flashes.forEach(f => { f.t += dt; });
        flashes = flashes.filter(f => f.t < 0.7);
      }
      break;
  }
}

// ---------------------------------------------------------------- rendering
// floor tiles and solid walls for the current stage, drawn once per size
function buildBg() {
  const s = canvas.width / W;
  const c = document.createElement('canvas');
  c.width = canvas.width; c.height = canvas.height;
  const g = c.getContext('2d');
  g.scale(s, s);
  const th = theme;
  for (let ty = 0; ty < H / T; ty++) for (let tx = 0; tx < COLS; tx++) {
    g.fillStyle = (tx + ty) % 2 ? th.fa : th.fb;
    g.fillRect(tx * T, ty * T, T, T);
    g.fillStyle = 'rgba(255,255,255,0.40)';
    g.fillRect(tx * T, ty * T, T, 1); g.fillRect(tx * T, ty * T, 1, T);
    g.fillStyle = 'rgba(0,0,0,0.10)';
    g.fillRect(tx * T + T - 1, ty * T, 1, T); g.fillRect(tx * T, ty * T + T - 1, T, 1);
  }
  g.fillStyle = '#b9a285';                         // kennel floor
  g.fillRect(11 * T, TOP + 13 * T, 6 * T, 3 * T);
  g.fillStyle = 'rgba(0,0,0,0.12)';
  for (let i = 1; i < 6; i++) g.fillRect((11 + i) * T, TOP + 13 * T, 1, 3 * T);
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    const px = x * T, py = TOP + y * T;
    if (MAZE[y][x] === '#') {
      g.fillStyle = (x + y) % 2 ? th.wa : th.wb;
      g.fillRect(px, py, T, T);
      g.fillStyle = th.hi; if (cell(x, y - 1) !== '#') g.fillRect(px, py, T, 2);
      g.fillStyle = th.hi2; if (cell(x - 1, y) !== '#') g.fillRect(px, py, 2, T);
      g.fillStyle = th.lo; if (cell(x, y + 1) !== '#') g.fillRect(px, py + T - 2, T, 2);
      if (cell(x + 1, y) !== '#') g.fillRect(px + T - 2, py, 2, T);
    } else {
      g.fillStyle = 'rgba(0,0,0,0.16)';
      if (cell(x, y - 1) === '#') g.fillRect(px, py, T, 5);
      if (cell(x - 1, y) === '#') g.fillRect(px, py, 3, T);
    }
  }
  // bedroom hall: rooms with beds sunk into the wall blocks
  if (st.beds) {
    for (const r of ROOMS_D) {
      g.fillStyle = '#c9a56f'; g.fillRect(r.x * T + 3, TOP + r.y * T + 3, r.w * T - 6, r.h * T - 6);
      g.fillStyle = 'rgba(0,0,0,0.12)';
      for (let i = 1; i < r.w; i++) g.fillRect(r.x * T + i * T, TOP + r.y * T + 3, 1, r.h * T - 6);
    }
    g.fillStyle = '#c9a56f'; g.fillRect(CAGE.x0, CAGE.y0, CAGE.x1 - CAGE.x0, CAGE.y1 - CAGE.y0);
    for (const b of bedRooms) drawBed(g, b.x, b.y, b.w, b.h, b.blanket, [b.spr]);
  }
  return c;
}

function resize() {
  // fit the board into the area the controls leave free, keeping the 448:576 shape
  const area = document.getElementById('boardWrap');
  const s = Math.min(area.clientWidth / W, area.clientHeight / H);
  if (s > 0) document.getElementById('wrap').style.width = Math.floor(W * s) + 'px';
  const r = canvas.getBoundingClientRect();
  const k = Math.max(1, r.width * (window.devicePixelRatio || 1) / W);
  canvas.width = Math.round(W * k);
  canvas.height = Math.round(H * k);
  bgCache = null;
}

function text(s, x, y, color, size, align = 'center', stroke = null) {
  ctx.font = `bold ${size}px "Courier New", monospace`;
  ctx.textAlign = align; ctx.textBaseline = 'middle';
  if (stroke) { ctx.lineJoin = 'round'; ctx.lineWidth = 3; ctx.strokeStyle = stroke; ctx.strokeText(s, x, y); }
  ctx.fillStyle = color;
  ctx.fillText(s, x, y);
}
// draw a pixel sprite centred on (cx, cy); s is canvas units per sprite pixel
function spr(img, cx, cy, s = PX, g = ctx) {
  const w = img.width * s, h = img.height * s;
  const x = Math.round(cx - w / 2), y = Math.round(cy - h / 2);
  if (img.sh) for (const [ox, oy] of [[-1, 0], [1, 0], [0, -1], [0, 1]]) g.drawImage(img.sh, x + ox, y + oy, w, h);
  g.drawImage(img, x, y, w, h);
}
// draw a sprite, plus a copy across the tunnel seam when it straddles the screen edge
function wrapDraw(px, fn) {
  fn(px);
  if (px < T) fn(px + W);
  else if (px > W - T) fn(px - W);
}
// a sleeper lying head-left on the floor
function lying(img, cx, cy, g = ctx) {
  g.save(); g.translate(cx, cy); g.rotate(-Math.PI / 2); spr(img, 0, 0, PX, g); g.restore();
}
// a bed (top view) with sleepers; the blanket covers the lower body
function drawBed(g, cx, cy, w, h, blanket, sleepersImgs) {
  g.fillStyle = '#6b3f1d'; g.fillRect(cx - w / 2 - 1, cy - h / 2 - 1, w + 2, h + 2);
  g.fillStyle = '#f1efe6'; g.fillRect(cx - w / 2 + 1, cy - h / 2 + 1, w - 2, h - 2);
  g.fillStyle = '#ffffff'; g.fillRect(cx - w / 2 + 2, cy - h / 2 + 2, 9, h - 4);
  sleepersImgs.forEach((im, i) => lying(im, cx - w / 2 + 11, cy + (i - (sleepersImgs.length - 1) / 2) * 20, g));
  g.fillStyle = blanket; g.fillRect(cx - w / 2 + 14, cy - h / 2 + 1, w - 15, h - 2);
  g.fillStyle = 'rgba(255,255,255,0.18)'; g.fillRect(cx - w / 2 + 14, cy - h / 2 + 1, w - 15, 2);
}

const heroDir = () => pac.fy < 0 ? 'up' : pac.fy > 0 ? 'down' : pac.fx > 0 ? 'right' : 'left';
const px2 = x => x * T, py2 = y => TOP + y * T;

function drawPac() {
  const set = SPR.hero;
  if (state === 'clear' && esc) {
    const u = clamp01(clearT / 0.9), a = 1 - clamp01((clearT - 0.6) / 0.4);
    ctx.globalAlpha = a;
    spr(set.down[Math.floor(clearT * 8) % 2], px2(lerp(esc.hx, esc.tx, u)), py2(lerp(esc.hy, esc.ty, u)));
    ctx.globalAlpha = 1;
    return;
  }
  const cx = px2(pac.x), cy = py2(pac.y);
  if (state === 'dying') {
    if (dieT < 0.7) { wrapDraw(cx, px => spr(set[heroDir()][0], px, cy)); return; }
    // caught for the last time: spin on the spot, shrink and fade out
    const u = Math.min(1, (dieT - 0.7) / 1.4);
    const dir = ['down', 'left', 'up', 'right'][Math.floor((dieT - 0.7) * 10) % 4];
    ctx.globalAlpha = 1 - u * u;
    wrapDraw(cx, px => spr(set[dir][0], px, cy, PX * (1 - 0.7 * u)));
    ctx.globalAlpha = 1;
    return;
  }
  if (state === 'title') return;
  if (hurtT > 0 && state === 'play' && P().flicker && Math.floor(time * 14) % 2 === 0) return;   // blink while invulnerable (normal pace)
  const f = pac.moving ? Math.floor(pac.phase / 2) % 2 : 0, dir = heroDir();
  if ((boostT > 0 || dotCharge > 0.5) && pac.moving) {
    for (const k of [2, 1]) {
      ctx.globalAlpha = 0.16 * (3 - k);
      wrapDraw(cx - pac.fx * k * 4.5, px => spr(set[dir][f], px, cy - pac.fy * k * 4.5));
    }
    ctx.globalAlpha = 1;
  }
  ctx.globalAlpha = hurtT > 0 && state === 'play' && !P().flicker ? 0.55 : 1;   // calm pace: just a soft fade
  wrapDraw(cx, px => spr(set[dir][f], px, cy));
  ctx.globalAlpha = 1;
  if (hasKey) spr(SPR.key, cx, cy - 15 + Math.sin(time * 6) * 1, 1.5);
}

function drawDog(g, px, cy, dx, dy) {
  const set = alarmT > 0 ? SPR.dogsAlert : SPR.dogs;
  const dir = dx > 0 ? 'right' : dx < 0 ? 'left' : dy < 0 ? 'up' : 'down';
  spr(set[dir][Math.floor(time * 8 + g.i) % 2], px, cy);
}

const hidden = () => (state === 'dying' && dieT > 0.7) || (state === 'clear' && clearT > 0.6);

function drawGhost(g) {
  if (hidden()) return;
  const cx = px2(g.x), cy = py2(g.y);
  if (g.kind === 'alien') {            // alien guard: shows a red "!" while it hunts you
    wrapDraw(cx, px => spr(SPR.alien[Math.floor(time * 6 + g.i) % 2], px, cy + Math.sin(time * 7 + g.i)));
    if (hunting(g)) text('!', cx, cy - 15, '#ff2a2a', 14, 'center', '#fff');
    return;
  }
  const dx = g.mode === 'leaving' ? 0 : g.dx, dy = g.mode === 'leaving' ? -1 : g.dy;
  wrapDraw(cx, px => drawDog(g, px, cy, dx, dy));
}

// each robot's red detection circle is drawn under the actors
function drawRobotRadius(r) {
  const cx = px2(r.x), cy = py2(r.y), R = ROBOT_R * T, a = r.alert;
  ctx.save();
  ctx.fillStyle = a ? 'rgba(255,30,30,0.24)' : 'rgba(255,30,30,0.10)';
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.fill();
  const ang = time * 2.2 + r.tx;
  ctx.fillStyle = a ? 'rgba(255,30,30,0.30)' : 'rgba(255,30,30,0.18)';
  ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, R, ang, ang + 0.55); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = a ? 'rgba(235,20,20,0.95)' : 'rgba(210,25,25,0.55)';
  ctx.lineWidth = 1.5; ctx.setLineDash([6, 4]); ctx.lineDashOffset = -time * 14;
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.stroke();
  ctx.restore();
}
function drawRobot(r) {
  const cx = px2(r.x), cy = py2(r.y) + Math.sin(time * 5 + r.tx) * 1;
  wrapDraw(cx, px => spr(r.alert ? SPR.robotAlert : SPR.robot, px, cy));

}
function drawAlien(a) {
  spr(SPR.alien[Math.floor(time * 6 + a.s) % 2], px2(a.x), py2(a.y) + Math.sin(time * 7 + a.s) * 1);
}

function drawFlower(cx, cy, s) { spr(SPR.flower, cx, cy, s); }

// stairs: concentric steps going down (dark centre) or up (light centre)
function drawStairs(s) {
  const x = s.x * T, y = TOP + s.y * T;
  const live = s.goal && state === 'play' && goalReady();
  const down = s.dir === 'down';
  ctx.fillStyle = '#0d0e12'; ctx.fillRect(x, y, T, T);
  for (let i = 0; i < 4; i++) {
    const v = down ? 120 - i * 28 : 40 + i * 28;
    ctx.fillStyle = `rgb(${v},${v + 6},${v + 18})`;
    ctx.fillRect(x + 1 + i * 2, y + 1 + i * 2, T - 2 - i * 4, T - 2 - i * 4);
  }
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  if (down) { ctx.moveTo(x + 4.5, y + 5); ctx.lineTo(x + 11.5, y + 5); ctx.lineTo(x + 8, y + 11); }
  else { ctx.moveTo(x + 4.5, y + 11); ctx.lineTo(x + 11.5, y + 11); ctx.lineTo(x + 8, y + 5); }
  ctx.fill();
  if (live || (s.goal && state === 'ready')) {
    ctx.strokeStyle = 'rgba(80,255,140,' + (0.5 + 0.4 * Math.sin(time * 6)) + ')';
    ctx.lineWidth = 2; ctx.strokeRect(x - 1, y - 1, T + 2, T + 2);
  } else if (s.goal) {
    ctx.strokeStyle = 'rgba(255,90,90,0.55)'; ctx.lineWidth = 1.5; ctx.strokeRect(x - 1, y - 1, T + 2, T + 2);
  }
}

function drawExit() {
  if (!st.exit) return;
  const x = 13 * T, y = TOP + EXIT_Y * T, openNow = goalReady() || state === 'clear';
  const pulse = 0.5 + 0.5 * Math.sin(time * 5);
  if (openNow) {
    ctx.fillStyle = 'rgba(80,255,140,' + (0.18 + 0.15 * pulse) + ')';
    ctx.fillRect(x - 6, y - 6, 2 * T + 12, T + 6);
  }
  ctx.fillStyle = openNow ? '#1d8f48' : '#6e2a2a';
  ctx.fillRect(x + 2, y + 2, 2 * T - 4, T - 2);
  ctx.fillStyle = openNow ? '#43e07f' : '#963838';
  ctx.fillRect(x + 4, y + 4, 2 * T - 8, T - 4);
  text('EXIT', x + T, y + 8, openNow ? '#06310f' : '#2e0e0e', 9);
}

// stage 3: the centre of the map is a dark room with an open entrance. He lies in the middle, tied to the four
// corners by black straps (an X). Walking in with the key turns the light on; touch him to cut him free.
function drawCenterRoom() {
  const rx = 11 * T, ry = TOP + 13 * T, rw = 6 * T, rh = 3 * T, cx = 14 * T, cy = py2(14.5);
  const s = sleepers[0];
  const strapA = roomOpen ? 1 - clamp01(cageOpenT / 0.4) : 1;       // the straps snap when he is freed
  if (strapA > 0) {
    ctx.globalAlpha = strapA;
    for (const [qx, qy] of [[rx + 3, ry + 3], [rx + rw - 3, ry + 3], [rx + 3, ry + rh - 3], [rx + rw - 3, ry + rh - 3]]) {
      ctx.strokeStyle = '#050507'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(qx, qy); ctx.stroke();
      ctx.strokeStyle = '#3b3b44'; ctx.lineWidth = 0.8; ctx.beginPath(); ctx.moveTo(cx, cy - 0.8); ctx.lineTo(qx, qy - 0.8); ctx.stroke();
      ctx.fillStyle = '#9aa0ad'; ctx.fillRect(qx - 2, qy - 2, 4, 4);     // ring bolted to the corner
    }
    ctx.globalAlpha = 1;
  }
  if (s) {
    if (s.mode === 'asleep') {
      lying(SPR.manSleep, cx, cy + Math.sin(time * 2) * 0.5);
      for (let k = 0; k < 3; k++) {
        const u = (time * 0.45 + k / 3) % 1;
        ctx.globalAlpha = Math.sin(u * Math.PI);

      }
      ctx.globalAlpha = 1;
    } else {
      spr(SPR.man.down[0], cx, cy);
      text('!', cx, cy - 15 - Math.abs(Math.sin(time * 14)) * 2, '#ff3030', 17, 'center', '#fff');
    }
  }
  // the room is dim and dark until the light goes on
  const flick = roomLit && lightT < 0.7 ? 0.5 + 0.5 * Math.sin(lightT * 40) : 1;
  const dark = roomLit ? Math.max(0, 1 - lightT / 1.0) * flick : 1;
  if (dark > 0) { ctx.fillStyle = 'rgba(4,4,12,' + (0.9 * dark) + ')'; ctx.fillRect(rx, ry, rw, rh); }
  if (roomLit && lightT < 0.8) { ctx.fillStyle = 'rgba(255,240,170,' + 0.35 * (1 - lightT / 0.8) + ')'; ctx.fillRect(rx, ry, rw, rh); }
}

// the top-centre room: the two girls' bed in stage 6
function drawRoom() {
  if (st.cage) { drawCenterRoom(); return; }
  if (!st.beds) return;
  const { x0, x1, y0, y1 } = CAGE;
  drawBed(ctx, 14 * T, (y0 + y1) / 2, 24, 66, '#ffffff', []);
  for (const s of sleepers) {
    const sx = px2(s.x), sy = py2(s.y);
    if (s.mode === 'asleep') {
      const breathe = Math.sin(time * 2 + s.x) * 0.5;
      const img = s.id === 'man' ? SPR.manSleep : s.id === 'pink' ? SPR.pinkSleep : SPR.blackSleep;
      ctx.save(); ctx.translate(sx, sy + breathe); ctx.rotate(-Math.PI / 2); spr(img, 0, 0); ctx.restore();
      for (let k = 0; k < 3; k++) {
        const u = (time * 0.45 + k / 3) % 1;
        ctx.globalAlpha = Math.sin(u * Math.PI);
        text(k % 2 ? 'Z' : 'z', sx + 6 + u * 7 + Math.sin(u * 9) * 1.5, sy - 8 - u * 22, '#cfe3ff', 8 + u * 8, 'center', '#0b0a10');
      }

    } else {
      spr(SPR[s.id].down[0], sx, sy);

    }
  }
  if (st.beds) {                       // blanket over the girls' legs
    ctx.fillStyle = '#ffffff'; ctx.fillRect(x0 + 11, y0 + 4, x1 - x0 - 12, y1 - y0 - 8);
    ctx.fillStyle = 'rgba(0,0,0,0.08)'; ctx.fillRect(x0 + 11, y0 + 4, x1 - x0 - 12, 2);
    for (const s of sleepers) if (s.mode !== 'asleep') spr(SPR[s.id].down[0], px2(s.x), py2(s.y));
  }
}

// z Z drifting above the strangers in the bedroom hall
function drawBedZ() {
  if (!st.beds) return;
  bedRooms.forEach((b, i) => {
    const u = (time * 0.35 + i * 0.37) % 1;
    ctx.globalAlpha = Math.sin(u * Math.PI) * 0.9;
    text(i % 2 ? 'Z' : 'z', b.x - b.w / 2 + 14 + u * 6, b.y - 6 - u * 10, '#3b2c60', 6 + u * 5, 'center', '#f5ecd8');
  });

}

// followers walk with the hero
function drawFollowers() {
  if (hidden() && state !== 'clear') return;
  if (state === 'clear' && esc) {
    esc.f.forEach((f, i) => {
      const u = clamp01((clearT - 0.35 - i * 0.15) / 0.9), a = 1 - clamp01((clearT - 0.9 - i * 0.15) / 0.4);
      ctx.globalAlpha = a;
      spr(SPR[f.id].down[Math.floor(clearT * 8) % 2], px2(lerp(f.x, esc.tx, u)), py2(lerp(f.y, esc.ty, u)));
      ctx.globalAlpha = 1;
    });
    return;
  }
  for (const f of team) {
    const fr = f.moving ? Math.floor(time * 8) % 2 : 0, cx = px2(f.x), cy = py2(f.y);
    wrapDraw(cx, px => spr(SPR[f.id][f.dir][fr], px, cy));
  }
}

function drawItem(it) {
  const y = py2(it.y) + Math.sin(time * 3 + it.tx) * 1.2, x = px2(it.x);
  ctx.fillStyle = 'rgba(0,0,0,0.18)'; ctx.beginPath(); ctx.ellipse(x, y + 7, 6, 2, 0, 0, Math.PI * 2); ctx.fill();
  const glint = 0.35 + 0.35 * Math.sin(time * 5 + it.ty);
  ctx.strokeStyle = 'rgba(122,61,207,' + glint + ')'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(x, y, 9, 0, Math.PI * 2); ctx.stroke();
  spr(it.img, x, y, it.scale);
}

// bedroom hall: the whole hall is dimly lit (much lighter than the dark room of stage 3). The girls' room is
// darker still until you arrive, then its light fades on.
function drawDim() {
  if (!st.beds || state === 'title') return;
  const { x0, x1, y0, y1 } = CAGE;
  ctx.save();
  ctx.beginPath(); ctx.rect(0, TOP, W, ROWS * T); ctx.rect(x0, y0, x1 - x0, y1 - y0);
  ctx.clip('evenodd');                             // everything except the girls' room
  ctx.fillStyle = 'rgba(14,8,28,0.38)'; ctx.fillRect(0, TOP, W, ROWS * T);
  ctx.restore();
  const flick = roomLit && lightT < 0.7 ? 0.5 + 0.5 * Math.sin(lightT * 40) : 1;
  const dark = roomLit ? Math.max(0, 1 - lightT / 1.0) * flick : 1;
  if (dark > 0) { ctx.fillStyle = 'rgba(10,6,22,' + 0.64 * dark + ')'; ctx.fillRect(x0, y0, x1 - x0, y1 - y0); }
  if (roomLit) {                                    // warm light glowing in the room
    ctx.fillStyle = 'rgba(255,228,150,' + (lightT < 0.9 ? 0.35 * (1 - lightT / 0.9) + 0.08 : 0.08) + ')';
    ctx.fillRect(x0, y0, x1 - x0, y1 - y0);
  }
}

// ---- guidance: where am I, and where do I need to go?
const rgba = (hex, a) => { const n = parseInt(hex.slice(1), 16); return 'rgba(' + (n >> 16) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')'; };

// the current goal(s), in tile units
function objectives() {
  const stair = () => { const s = st.stairs.find(q => q.goal); return s && { x: s.x + 0.5, y: s.y + 0.5, label: s.dir === 'down' ? 'STAIRS ▼' : 'STAIRS ▲', color: '#43e07f' }; };
  const exit = { x: 14, y: 29.5, label: 'EXIT', color: '#43e07f' };
  let o = null;
  switch (stageNo) {
    case 1: case 4: o = stair(); break;
    case 2: o = keyS.mode === 'out' ? { x: keyS.x, y: keyS.y, label: 'KEY', color: '#ffd23a' } : hasKey ? stair() : null; break;
    case 3: o = sleepers.length ? { x: 14, y: 14.5, label: roomLit ? 'HIM' : 'DARK ROOM', color: '#4ee6d9' } : stair(); break;
    case 5: o = exit; break;
    case 6: o = sleepers.length ? { x: 14, y: 2.6, label: 'GIRLS', color: '#ff7fb0' } : exit; break;
  }
  return o ? [o] : [];
}

// a soft glow under the hero so they stand out from the maze
function drawHeroGlow() {
  const x = px2(pac.x), y = py2(pac.y);
  const g = ctx.createRadialGradient(x, y, 2, x, y, 17);
  g.addColorStop(0, 'rgba(255,240,150,0.5)'); g.addColorStop(1, 'rgba(255,240,150,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, 17, 0, Math.PI * 2); ctx.fill();
}

// "YOU" marker at the start of every stage: pulsing ring, bouncing arrow and label
function drawHeroMarker() {
  if (!(state === 'ready' || (state === 'play' && pacDist < 3 && stageT < 7))) return;
  const x = px2(pac.x), y = py2(pac.y), p = (time * 1.2) % 1;
  ctx.strokeStyle = '#ffe66b'; ctx.lineWidth = 2;
  ctx.globalAlpha = 0.9 * (1 - p); ctx.beginPath(); ctx.arc(x, y, 9 + p * 18, 0, Math.PI * 2); ctx.stroke();
  ctx.globalAlpha = 0.85; ctx.beginPath(); ctx.arc(x, y, 12, 0, Math.PI * 2); ctx.stroke();
  ctx.globalAlpha = 1;
  const by = y - 24 - Math.abs(Math.sin(time * 5)) * 4;
  ctx.fillStyle = '#ffe66b'; ctx.strokeStyle = '#000'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(x - 6, by - 6); ctx.lineTo(x + 6, by - 6); ctx.lineTo(x, by + 4); ctx.closePath(); ctx.stroke(); ctx.fill();
  text('YOU', Math.max(14, Math.min(W - 14, x)), by - 14, '#ffe66b', 11, 'center', '#000');
}

// beacons on the goal: pulsing rings, a light shaft and a label, plus a little arrow beside the hero pointing there
function drawBeacons() {
  if (state !== 'play' && state !== 'ready') return;
  for (const o of objectives()) {
    const x = px2(o.x), y = py2(o.y), p = (time * 0.9) % 1;
    const gr = ctx.createLinearGradient(0, y, 0, y - 64);
    gr.addColorStop(0, rgba(o.color, 0.6)); gr.addColorStop(1, rgba(o.color, 0));
    ctx.fillStyle = gr; ctx.fillRect(x - 6, y - 64, 12, 64);
    ctx.strokeStyle = o.color; ctx.lineWidth = 2;
    for (const q of [p, (p + 0.5) % 1]) { ctx.globalAlpha = (1 - q) * 0.9; ctx.beginPath(); ctx.arc(x, y, 6 + q * 20, 0, Math.PI * 2); ctx.stroke(); }
    ctx.globalAlpha = 1;
    // label above the shaft (below the goal if it is at the top of the screen)
    const above = y - 74 > TOP + 6, ly = above ? y - 74 + Math.sin(time * 4) * 2 : y + 26;
    ctx.font = 'bold 11px "Courier New", monospace';
    const half = ctx.measureText(o.label).width / 2 + 3, lx = Math.max(half, Math.min(W - half, x));
    text(o.label, lx, ly, o.color, 11, 'center', '#000');
    // compass arrow next to the hero, only when the goal is some way off
    const dx = o.x - pac.x, dy = o.y - pac.y, d = Math.hypot(dx, dy);
    if (state === 'play' && d > 4) {
      const a = Math.atan2(dy, dx), hx = px2(pac.x), hy = py2(pac.y);
      ctx.save(); ctx.translate(hx + Math.cos(a) * 27, hy + Math.sin(a) * 27); ctx.rotate(a);
      ctx.globalAlpha = 0.8 + 0.2 * Math.sin(time * 6);
      ctx.fillStyle = o.color; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2; ctx.lineJoin = 'round';
      ctx.beginPath(); ctx.moveTo(11, 0); ctx.lineTo(-5, -8); ctx.lineTo(-1, 0); ctx.lineTo(-5, 8); ctx.closePath(); ctx.stroke(); ctx.fill();
      ctx.restore(); ctx.globalAlpha = 1;
    }
  }
}

function drawPanel(y0, y1) {
  ctx.fillStyle = 'rgba(8,8,12,0.86)';
  ctx.fillRect(0, TOP + y0 * T, W, (y1 - y0) * T);
}

function hintText() {
  if (state === 'ready') return '';
  if (doomT > 0) return 'HE IS GIVING UP...';
  if (memN > 0) return 'HE IS FALLING BEHIND...';
  switch (stageNo) {
    case 1: return 'REACH THE STAIRS!';
    case 2: return keyS.mode === 'out' ? 'GET THE KEY!' : hasKey ? 'TAKE THE STAIRS DOWN!' : 'KEY IS COMING...';
    case 3: return sleepers.length ? (!roomLit ? (hasKey ? 'ENTER THE DARK ROOM!' : 'NEED THE KEY!') : 'UNTIE HIM!') : team.length ? 'GO BACK UP!' : '';
    case 4: return 'BRING HIM UP!';
    case 5: return '';
    case 6: return sleepers.length ? 'WAKE THE GIRLS!' : 'REACH THE EXIT!';
  }
  return '';
}

// ---- ending scenes
const STARS = Array.from({ length: 70 }, () => ({ x: Math.random() * W, y: Math.random() * 300, r: Math.random() * 1.2 + 0.4, p: Math.random() * 6 }));
// a four-point twinkle
function star(x, y, r, color) {
  ctx.fillStyle = color; ctx.beginPath();
  ctx.moveTo(x, y - r); ctx.lineTo(x + r * 0.3, y - r * 0.3); ctx.lineTo(x + r, y); ctx.lineTo(x + r * 0.3, y + r * 0.3);
  ctx.lineTo(x, y + r); ctx.lineTo(x - r * 0.3, y + r * 0.3); ctx.lineTo(x - r, y); ctx.lineTo(x - r * 0.3, y - r * 0.3);
  ctx.closePath(); ctx.fill();
}
// paint a happy face (^ ^ eyes, blush and a smile) over a front-facing 3x sprite
function happyFace(cx, cy) {
  const left = Math.round(cx - 10.5), top = Math.round(cy - 12);
  for (const ex of [left + 7.5, left + 13.5]) {
    const ey = top + 10.5;
    ctx.fillStyle = '#f6cfa6'; ctx.fillRect(ex - 1.8, ey - 1.8, 3.6, 3.6);
    ctx.strokeStyle = '#2a1a1a'; ctx.lineWidth = 1.4; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(ex - 2.3, ey + 1.4); ctx.lineTo(ex, ey - 1.4); ctx.lineTo(ex + 2.3, ey + 1.4); ctx.stroke();
    ctx.fillStyle = 'rgba(255,110,130,0.7)'; ctx.fillRect(ex + (ex < cx ? -2.6 : 0.6), ey + 2.4, 2, 1.4);
  }
  ctx.strokeStyle = '#7a2a2a'; ctx.lineWidth = 1.1;
  ctx.beginPath(); ctx.arc(cx, top + 12.2, 2.2, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
}
function drawGrassScene(count, trueEnd) {
  const t = ending.t, hz = 340;
  const sky = ctx.createLinearGradient(0, 0, 0, hz);
  // a blood-orange sky: near-black red overhead, burning orange at the horizon
  sky.addColorStop(0, '#1c0307'); sky.addColorStop(0.45, '#6a1210'); sky.addColorStop(0.8, '#d4441b'); sky.addColorStop(1, '#ffa23c');
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, hz);
  ctx.fillStyle = '#ffd9b0';
  for (const s of STARS) { ctx.globalAlpha = (0.35 + 0.35 * Math.sin(time * 2 + s.p)) * (1 - s.y / 380); ctx.fillRect(s.x, s.y, s.r, s.r); }
  ctx.globalAlpha = 1;
  // meteors falling in the background: red-orange fireballs with long fiery tails
  for (const m of meteors) {
    const x2 = m.x - m.vx * m.len * 1.6, y2 = m.y - m.vy * m.len * 1.6;
    const gr = ctx.createLinearGradient(m.x, m.y, x2, y2);
    gr.addColorStop(0, 'rgba(255,196,110,1)'); gr.addColorStop(0.35, 'rgba(255,92,24,0.85)'); gr.addColorStop(1, 'rgba(200,20,10,0)');
    ctx.strokeStyle = gr; ctx.lineWidth = 4; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(m.x, m.y); ctx.lineTo(x2, y2); ctx.stroke();
    ctx.lineCap = 'butt';
    ctx.fillStyle = 'rgba(255,90,30,0.35)'; ctx.beginPath(); ctx.arc(m.x, m.y, 8, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffe2a8'; ctx.beginPath(); ctx.arc(m.x, m.y, 3.5, 0, Math.PI * 2); ctx.fill();
  }
  // distant hills and the glow where meteors land
  ctx.fillStyle = '#2b0e0c';
  ctx.beginPath(); ctx.moveTo(0, hz);
  for (let x = 0; x <= W; x += 16) ctx.lineTo(x, hz - 18 - 14 * Math.sin(x * 0.02) - 8 * Math.sin(x * 0.07));
  ctx.lineTo(W, hz + 8); ctx.lineTo(0, hz + 8); ctx.fill();
  for (const f of flashes) {
    const k = f.t / 0.7;
    ctx.globalAlpha = (1 - k) * 0.8;
    ctx.fillStyle = '#ff7a30';
    ctx.beginPath(); ctx.ellipse(f.x, hz - 6, 8 + k * 26, 3 + k * 8, 0, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  // grass field
  const gg = ctx.createLinearGradient(0, hz, 0, H);
  gg.addColorStop(0, '#3d9a45'); gg.addColorStop(1, '#1f6a31');
  ctx.fillStyle = gg; ctx.fillRect(0, hz, W, H - hz);
  ctx.strokeStyle = 'rgba(20,70,30,0.55)'; ctx.lineWidth = 1;
  for (let i = 0; i < 160; i++) {
    const gx = (i * 53) % W, gy = hz + 6 + ((i * 97) % (H - hz - 10));
    ctx.beginPath(); ctx.moveTo(gx, gy); ctx.lineTo(gx - 1, gy - 4); ctx.moveTo(gx + 3, gy); ctx.lineTo(gx + 4, gy - 3); ctx.stroke();
  }
  ctx.fillStyle = 'rgba(255,90,30,0.12)'; ctx.fillRect(0, hz, W, H - hz);       // the red sky tints the grass
  // the wall they escaped from, with the open door
  ctx.fillStyle = '#4a4d58'; ctx.fillRect(0, 210, 96, 300);
  ctx.fillStyle = '#5d6170';
  for (let r = 0; r < 15; r++) for (let c = 0; c < 5; c++) ctx.fillRect(c * 20 + (r % 2) * 10 - 4, 212 + r * 20, 18, 8);
  ctx.fillStyle = '#121317'; ctx.fillRect(24, 400, 44, 110);
  ctx.fillStyle = 'rgba(255,240,170,0.5)'; ctx.fillRect(28, 404, 36, 100);
  // they walk out of the door and along the grass
  const crew = trueEnd ? ['hero', 'man', 'pink', 'black'] : ['hero', 'man'];
  // flowers drift down once the first of them is out, like confetti
  if (t > 3.2) for (let k = 0; k < 12; k++) {
    const fx = (k * 41 + 18 + Math.sin(t * 1.3 + k) * 16 + W) % W, fy = 40 + (((t - 3.2) * 36 + k * 47) % 470);
    ctx.globalAlpha = 0.9; spr(SPR.flower, fx, fy, 1 + 0.3 * (k % 3)); ctx.globalAlpha = 1;
  }
  const happy = [];
  crew.forEach((id, i) => {
    const t0 = i * 0.9, u = clamp01((t - t0) / 3.2), target = 330 - i * 52;
    if (t < t0) return;
    const x = lerp(46, target, u), baseY = 470 + (i % 2) * 8, walking = u < 1;
    const jump = walking ? 0 : Math.abs(Math.sin((t - t0 - 3.2) * 6 + i * 1.3)) * 12;   // hopping for joy
    const set = id === 'hero' ? SPR.hero : SPR[id];
    ctx.globalAlpha = clamp01((t - t0) / 0.4);
    ctx.fillStyle = 'rgba(0,0,0,0.28)'; ctx.beginPath(); ctx.ellipse(x, baseY + 14, 11 - jump * 0.35, 3, 0, 0, Math.PI * 2); ctx.fill();
    spr(set[walking ? 'right' : 'down'][walking ? Math.floor(t * 8 + i) % 2 : 0], x, baseY - jump, 3);
    ctx.globalAlpha = 1;
    if (!walking) { happyFace(x, baseY - jump); happy.push([x, baseY - jump, i]); }
  });
  for (const [x, y, i] of happy) {
    for (let k = 0; k < 3; k++) {            // hearts float up
      const u = (t * 0.55 + k / 3 + i * 0.21) % 1;
      ctx.globalAlpha = Math.sin(u * Math.PI);
      spr(SPR.heart, x + (k - 1) * 12 + Math.sin(u * 8 + k) * 4, y - 26 - u * 55, 1.2 + 0.4 * Math.sin(u * Math.PI));
    }
    ctx.globalAlpha = 1;
    for (let m = 0; m < 3; m++) {            // stars twinkle around them
      const a = t * 1.5 + m * 2.09 + i;
      star(x + Math.cos(a) * 28, y - 6 + Math.sin(a) * 20, 3.5 + 1.5 * Math.sin(t * 6 + m + i), '#fff2a0');
    }
  }
  const done = t > 3.2 + (crew.length - 1) * 0.9;
  if (done) {
    text(trueEnd ? 'TRUE END' : 'SUCCESS END', W / 2, 90, '#ffe27a', 30, 'center', '#000');
    text(trueEnd ? 'ALL FOUR MADE IT OUT.' : 'THE TWO OF YOU MADE IT OUT.', W / 2, 122, '#ffffff', 13, 'center', '#000');
    text(trueEnd ? 'THE SKY WAS FULL OF METEORS.' : 'THE SKY WAS FULL OF METEORS.', W / 2, 142, '#cfe3ff', 11, 'center', '#000');
    if (t > 6 && Math.floor(time * 2) % 2 === 0) text('PRESS ANY KEY / TAP', W / 2, 520, '#ffffff', 14, 'center', '#000');
  }
}
function drawBadEnding() {
  const t = ending.t;
  ctx.fillStyle = '#08080c'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#17171f'; ctx.fillRect(0, 380, W, 200);
  // he stops, turns away and walks back; the dogs close in
  const manX = lerp(200, 300, clamp01(t / 5));
  spr(SPR.hero.right[Math.floor(t * 4) % 2], 130, 360, 3);
  spr(SPR.man[t < 1 ? 'right' : 'right'][Math.floor(t * 3) % 2], manX, 360, 3);
  for (let i = 0; i < 3; i++) {
    const dx = lerp(560 + i * 50, 380 + i * 36, clamp01(t / 5));
    spr(SPR.dogsAlert.left[Math.floor(t * 8 + i) % 2], dx, 365 + (i - 1) * 6, 3);
  }
  ctx.globalAlpha = clamp01((t - 1) / 1.5);
  text('BAD END', W / 2, 140, '#ff3b3b', 36, 'center', '#000');
  text('HE STOPPED. HE TURNED BACK.', W / 2, 190, '#ffffff', 13, 'center', '#000');
  text('THE DOGS GOT HIM.', W / 2, 212, '#ffffff', 13, 'center', '#000');
  ctx.globalAlpha = 1;
  if (t > 6 && Math.floor(time * 2) % 2 === 0) text('PRESS ANY KEY / TAP', W / 2, 500, '#ffffff', 14, 'center', '#000');
}

function draw() {
  ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
  ctx.imageSmoothingEnabled = false;
  if (state === 'ending') {
    if (ending.kind === 'bad') drawBadEnding(); else drawGrassScene(0, ending.kind === 'true');
    return;
  }
  if (shakeT > 0) ctx.translate((Math.random() - 0.5) * 4, (Math.random() - 0.5) * 4);
  if (!bgCache) bgCache = buildBg();
  ctx.drawImage(bgCache, 0, 0, W, H);

  // HUD
  const blink = Math.floor(time * 2) % 2 === 0;
  if (state === 'title' || state === 'over' || blink) text('1UP', 4.5 * T, 0.9 * T, INK, 14);
  text(String(score).padStart(2, '0'), 4.5 * T, 2.0 * T, INK, 14);
  text('HIGH SCORE', 14 * T, 0.9 * T, INK, 14);
  text(String(best).padStart(2, '0'), 14 * T, 2.0 * T, INK, 14);
  text('STAGE', 19.5 * T, 0.9 * T, INK, 14);
  text(String(stageNo), 19.5 * T, 2.0 * T, INK, 14);

  ctx.fillStyle = '#c99a5b';                       // kennel gate
  if (!st.cage) ctx.fillRect(13 * T, TOP + 12 * T + 6, 2 * T, 3);       // (the centre room in stage 3 has no door)
  drawExit();
  st.stairs.forEach(drawStairs);
  drawRoom();

  // dots (speed) and corner flowers (+1 heart)
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    const v = pellets[y * COLS + x];
    if (!v) continue;
    const cx = (x + 0.5) * T, cy = TOP + (y + 0.5) * T;
    if (v === 1) {
      ctx.fillStyle = '#7a4a10'; ctx.beginPath(); ctx.arc(cx, cy, 2.6, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#f3a21f'; ctx.beginPath(); ctx.arc(cx, cy, 1.8, 0, Math.PI * 2); ctx.fill();
    } else drawFlower(cx, cy, 1.25 + 0.12 * Math.sin(time * 6));
  }
  drawBedZ();

  // bonus flower
  if (bonus && state !== 'title' && (bonus.t > 2 || Math.floor(time * 6) % 2 === 0)) {
    const by = TOP + 17.5 * T + Math.sin(time * 4) * 1.2;
    ctx.strokeStyle = 'rgba(220,40,70,' + (0.45 + 0.3 * Math.sin(time * 8)) + ')';
    ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.arc(14 * T, by, 10.5 + Math.sin(time * 8), 0, Math.PI * 2); ctx.stroke();
    drawFlower(14 * T, by, 1.8);
  }

  // the key waiting somewhere in the maze
  if (keyS.mode === 'out') {
    const kx = px2(keyS.x), ky = py2(keyS.y) + Math.sin(time * 4) * 1.5;
    ctx.strokeStyle = 'rgba(240,170,0,' + (0.5 + 0.4 * Math.sin(time * 7)) + ')';
    ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.arc(kx, ky, 9 + Math.sin(time * 7) * 1.5, 0, Math.PI * 2); ctx.stroke();
    spr(SPR.key, kx, ky, 2);
  }
  if (state !== 'title') items.forEach(drawItem);

  // actors
  if (state !== 'title' && !hidden()) robots.forEach(drawRobotRadius);
  ghosts.forEach(drawGhost);
  if (state !== 'title' && !hidden()) { robots.forEach(drawRobot); aliens.forEach(drawAlien); }
  drawFollowers();
  if (state === 'play' || state === 'ready') drawHeroGlow();
  drawPac();
  drawDim();
  drawBeacons();
  drawHeroMarker();

  // popups
  for (const p of popups) {
    // keep long pop-ups on screen, and fade them out at the end
    ctx.font = 'bold 11px "Courier New", monospace';
    const half = ctx.measureText(p.text).width / 2 + 4;
    ctx.globalAlpha = clamp01((p.life - p.t) / 0.5);
    text(p.text, Math.max(half, Math.min(W - half, px2(p.x))), py2(p.y) - Math.min(p.t, 1) * 10, p.color, 11, 'center', '#000');
  }
  ctx.globalAlpha = 1;

  // bottom HUD: hearts, objective hint + speed meter, level flowers
  const hy = TOP + 32 * T;
  for (let i = 0; i < hearts; i++) spr(SPR.heart, 20 + i * 15, hy, 1.6 + (hearts === 1 ? 0.15 * Math.sin(time * 8) : 0));
  const hint = hintText();
  if (stageNo === 5 && state !== 'ready') {
    // reminder of what to avoid; items you already touched are greyed out
    const x0 = 11.6 * T - 46;
    text('AVOID', x0, hy - 2, INK, 9, 'left');
    for (const [id, ox] of [['paper', 40], ['note', 54], ['pencil', 66], ['guitar', 86]]) {
      ctx.globalAlpha = items.some(it => it.id === id) ? 1 : 0.25;
      spr(ITEM_KINDS.find(k => k.id === id).img, x0 + ox, hy - 2, 1.2);
    }
    ctx.globalAlpha = 1;
    if (hint) text(hint, 11.6 * T, hy - 13, '#7a1f1f', 9);
  } else if (hint) text(hint, 11.6 * T, hy - 3, INK, 10);
  if (boostT > 0 || dotCharge > 0.02) {
    ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.fillRect(11.6 * T - 36, hy + 5, 72, 5);
    ctx.fillStyle = boostT > 0 ? '#e5112b' : '#f3a21f';
    ctx.fillRect(11.6 * T - 36, hy + 5, 72 * (boostT > 0 ? boostT / BOOST_SECS : dotCharge), 5);
  }
  for (let i = 0; i < 6; i++) {                    // stage progress: filled flower = reached
    ctx.globalAlpha = i < stageNo ? 1 : 0.25;
    drawFlower(W - (1.4 + (5 - i) * 1.25) * T, hy, 1.0);
  }
  ctx.globalAlpha = 1;

  // overlays
  if (state === 'ready') {
    drawPanel(9.2, 11.9 + 0.9 * st.brief.length + 0.9);
    text('STAGE ' + stageNo, 14 * T, TOP + 10.2 * T, '#ffffff', 22);
    text(st.name, 14 * T, TOP + 11.6 * T, '#ffd86b', 14);
    st.brief.forEach((line, i) => text(line, 14 * T, TOP + (12.9 + 0.9 * i) * T, '#cfe3ff', 10));
    text('READY!', 14 * T, TOP + 17.5 * T, '#ffeb00', 16, 'center', '#000');
  }
  if (state === 'clear' && clearT > 0.9) {
    const k = esc ? esc.kind : 'exit';
    text(k === 'down' ? 'GOING DOWN...' : k === 'up' ? 'GOING UP...' : 'OUTSIDE!', 14 * T, TOP + 17.5 * T, '#4ee6d9', 16, 'center', '#000');
  }
  if (state === 'over') {
    text('GAME  OVER', 14 * T, TOP + 17.5 * T, '#ff2a2a', 16, 'center', '#000');
    if (overT > 1.2) {
      drawPanel(19.4, 23.6);
      if (blink) text('PRESS ANY KEY / TAP', 14 * T, TOP + 20.6 * T, '#fff', 14);
      text('RETRY STAGE ' + stageNo, 14 * T, TOP + 22.4 * T, '#4ee6d9', 11);
    }
  }
  if (state === 'title') {
    drawPanel(9, 24.4);
    text('RESCUE RUN', 14 * T + 2, TOP + 11.1 * T + 2, '#a00000', 36);
    text('RESCUE RUN', 14 * T, TOP + 11.1 * T, '#ffffff', 36);
    text('FREE HIM. ESCAPE TOGETHER.', 14 * T, TOP + 12.7 * T, '#4ee6d9', 12);
    const wf = Math.floor(time * 8) % 2;
    spr(SPR.alien[wf], 3.4 * T, TOP + 15.3 * T);
    spr(SPR.robot, 6 * T, TOP + 15.3 * T);
    for (let i = 0; i < 3; i++) spr(SPR.dogs.right[Math.floor(time * 8 + i) % 2], (8.2 + i * 2.2) * T, TOP + 15.4 * T);
    spr(SPR.hero.right[wf], 15.2 * T, TOP + 15.4 * T);
    spr(SPR.man.down[0], 20.6 * T, TOP + 15.4 * T);
    text('GO DOWN. FIND THE KEY. FREE HIM.', 14 * T, TOP + 17.3 * T, '#ffd86b', 11);
    text('CARRY HIM OUT. AVOID THE MEMORIES.', 14 * T, TOP + 18.3 * T, '#ffd86b', 11);
    text('DOTS = SPEED  FLOWERS = +1 HEART', 14 * T, TOP + 19.3 * T, '#ff7f93', 11);
    text('PACE: ' + (calm ? 'CALM' : 'NORMAL') + (TOUCH ? '  (TURTLE BUTTON)' : '  (PRESS C)'), 14 * T, TOP + 20.1 * T, calm ? '#4ee6d9' : '#ff7f93', 10);
    if (blink) text('PRESS ANY KEY / TAP', 14 * T, TOP + 21 * T, '#fff', 14);
    if (TOUCH) {
      text('D-PAD OR SWIPE TO MOVE', 14 * T, TOP + 22.5 * T, '#9ab', 11);
      text('TOP BUTTONS: PAUSE / SOUND', 14 * T, TOP + 23.5 * T, '#9ab', 11);
    } else {
      text('ARROWS / WASD / SWIPE', 14 * T, TOP + 22.5 * T, '#9ab', 11);
      text('P PAUSE   M SOUND', 14 * T, TOP + 23.5 * T, '#9ab', 11);
    }
  }
  // fade between stages
  const fade = state === 'clear' ? clamp01((clearT - 1.1) / 0.7) : fadeIn / 0.7;
  if (fade > 0) { ctx.fillStyle = 'rgba(0,0,0,' + fade + ')'; ctx.fillRect(-8, -8, W + 16, H + 16); }
  if (paused) {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, 0, W, H);
    text('PAUSED', 14 * T, TOP + 15 * T, '#ffeb00', 28);
    text('P / TAP ▶ TO RESUME', 14 * T, TOP + 17.5 * T, '#fff', 12);
  }
}

// ---------------------------------------------------------------- input
const KEYS = {
  ArrowUp: 'up', KeyW: 'up', ArrowLeft: 'left', KeyA: 'left',
  ArrowDown: 'down', KeyS: 'down', ArrowRight: 'right', KeyD: 'right',
};
function anyInput() {
  if (state === 'title') startGame();
  else if (state === 'over' && overT > 1.2) retryStage();
  else if (state === 'ending' && ending.t > 6) { state = 'title'; ending = null; loadStage(1); }
}
function steer(d) {
  audioInit();
  if (paused) return;
  anyInput();
  want = d;
}
function togglePause() {
  if (state === 'title' || state === 'over' || state === 'ending') return;
  paused = !paused;
  document.getElementById('bPause').innerHTML = paused ? '&#9654;' : '&#9208;';
}
function toggleCalm() {
  calm = !calm;
  document.getElementById('bMode').innerHTML = calm ? '&#128034;' : '&#128007;';
  try { localStorage.setItem('rescue-calm', calm ? '1' : '0'); } catch (e) {}
  lv = levelParams(stageNo);                       // speeds change right away, chaser counts from the next stage
  popup(7, 3, calm ? 'CALM MODE' : 'NORMAL MODE', calm ? '#4ee6d9' : '#ff7f93', 1.6);
}
function toggleMute() {
  muted = !muted;
  document.getElementById('bSnd').innerHTML = muted ? '&#128263;' : '&#128266;';
  try { localStorage.setItem('rescue-mute', muted ? '1' : '0'); } catch (e) {}
}

addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const d = KEYS[e.code];
  if (d) { e.preventDefault(); steer(DIRS[d]); }
  else if (e.code === 'KeyP' || e.code === 'Escape') togglePause();
  else if (e.code === 'KeyM') toggleMute();
  else if (e.code === 'KeyC') toggleCalm();
  else if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); audioInit(); anyInput(); }
});

let sx = 0, sy = 0, dragging = false;
canvas.addEventListener('pointerdown', e => {
  audioInit();
  if (paused) { togglePause(); return; }
  anyInput();
  sx = e.clientX; sy = e.clientY; dragging = true;
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', e => {
  if (!dragging) return;
  const dx = e.clientX - sx, dy = e.clientY - sy;
  if (Math.hypot(dx, dy) < 18) return;
  steer(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? DIRS.right : DIRS.left) : (dy > 0 ? DIRS.down : DIRS.up));
  sx = e.clientX; sy = e.clientY;
});
const endDrag = () => { dragging = false; };
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);
canvas.addEventListener('contextmenu', e => e.preventDefault());

document.getElementById('bPause').addEventListener('click', e => { e.currentTarget.blur(); togglePause(); });
document.getElementById('bMode').addEventListener('click', e => { e.currentTarget.blur(); toggleCalm(); });
document.getElementById('bMode').innerHTML = calm ? '&#128034;' : '&#128007;';
document.getElementById('bSnd').addEventListener('click', e => { e.currentTarget.blur(); audioInit(); toggleMute(); });
document.getElementById('bSnd').innerHTML = muted ? '&#128263;' : '&#128266;';

addEventListener('blur', () => { if (!paused && state !== 'title' && state !== 'over' && state !== 'ending') togglePause(); });
document.addEventListener('visibilitychange', () => {
  if (document.hidden && !paused && state !== 'title' && state !== 'over' && state !== 'ending') togglePause();
});
addEventListener('resize', resize);
if (window.ResizeObserver) new ResizeObserver(resize).observe(document.getElementById('boardWrap'));

// on-screen D-pad: a tap sets the direction, and the hero keeps going until a wall
document.querySelectorAll('.d').forEach(b => b.addEventListener('pointerdown', e => {
  e.preventDefault();
  audioInit();
  if (paused) { togglePause(); return; }
  steer(DIRS[b.dataset.dir]);
}));

// ---------------------------------------------------------------- main loop
let last = 0;
function frame(ts) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (ts - last) / 1000 || 0);
  last = ts;
  if (!paused) tick(dt);
  draw();
}

resize();
loadStage(1);
requestAnimationFrame(frame);
</script>
</body>
</html>
